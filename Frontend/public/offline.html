<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ANARC — Offline</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; background: #080706; color: white; font-family: 'DM Mono', monospace; }
    body { display: flex; align-items: center; justify-content: center; min-height: 100vh; gap: 80px; padding: 40px; }
    .light-cyan { position: fixed; top: 0; right: 0; width: 600px; height: 600px; background: radial-gradient(ellipse at 100% 0%, rgba(94,234,240,0.4) 0%, transparent 60%); pointer-events: none; }
    .light-amber { position: fixed; bottom: 0; left: 0; width: 500px; height: 500px; background: radial-gradient(ellipse at 0% 100%, rgba(255,180,84,0.35) 0%, transparent 60%); pointer-events: none; }

    /* Robot meme SVG */
    .meme { flex-shrink: 0; opacity: 0.9; }

    .right { display: flex; flex-direction: column; gap: 20px; max-width: 520px; }
    .tag { color: #5eeaf0; font-size: 11px; letter-spacing: 0.3em; }
    h1 { font-size: 52px; font-weight: bold; line-height: 1.1; }
    .terminal { background: rgba(255,255,255,0.03); border: 1px solid rgba(94,234,240,0.15); border-radius: 8px; padding: 20px 24px; display: flex; flex-direction: column; gap: 10px; }
    .terminal p { font-size: 13px; color: #5eeaf0; letter-spacing: 0.03em; }
    .terminal p.dim { color: rgba(94,234,240,0.5); }
    .blink { animation: blink 1s step-end infinite; }
    @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }
    .desc { color: rgba(255,255,255,0.4); font-size: 13px; line-height: 1.8; }
    button { padding: 12px 28px; border: 2px solid rgba(94,234,240,0.4); border-radius: 8px; background: transparent; color: #5eeaf0; font-family: 'DM Mono', monospace; font-size: 13px; letter-spacing: 0.1em; cursor: pointer; transition: all 0.3s; width: fit-content; display: flex; align-items: center; gap: 8px; }
    button:hover { background: rgba(94,234,240,0.08); border-color: #5eeaf0; }

    @media (max-width: 700px) {
      body { flex-direction: column; align-items: center; text-align: center; }
      button { align-self: center; }
    }
  </style>
</head>
<body>
  <div class="light-cyan"></div>
  <div class="light-amber"></div>

  <!-- Sad robot meme -->
  <svg class="meme" width="260" height="340" viewBox="0 0 260 340" fill="none" xmlns="http://www.w3.org/2000/svg">
    <!-- Body -->
    <rect x="70" y="130" width="120" height="130" rx="16" fill="rgba(94,234,240,0.05)" stroke="rgba(94,234,240,0.3)" stroke-width="2"/>
    <!-- Head -->
    <rect x="80" y="50" width="100" height="90" rx="14" fill="rgba(94,234,240,0.05)" stroke="rgba(94,234,240,0.3)" stroke-width="2"/>
    <!-- Eyes - sad -->
    <circle cx="108" cy="85" r="10" fill="rgba(94,234,240,0.15)" stroke="rgba(94,234,240,0.5)" stroke-width="1.5"/>
    <circle cx="152" cy="85" r="10" fill="rgba(94,234,240,0.15)" stroke="rgba(94,234,240,0.5)" stroke-width="1.5"/>
    <!-- Pupils looking down -->
    <circle cx="108" cy="89" r="4" fill="#5eeaf0"/>
    <circle cx="152" cy="89" r="4" fill="#5eeaf0"/>
    <!-- Sad mouth -->
    <path d="M108 108 Q130 100 152 108" stroke="rgba(94,234,240,0.5)" stroke-width="2" fill="none" stroke-linecap="round"/>
    <!-- Antenna -->
    <line x1="130" y1="50" x2="130" y2="28" stroke="rgba(94,234,240,0.4)" stroke-width="2"/>
    <circle cx="130" cy="24" r="5" fill="rgba(255,180,84,0.6)" stroke="rgba(255,180,84,0.8)" stroke-width="1.5"/>
    <!-- Arms -->
    <line x1="70" y1="155" x2="30" y2="195" stroke="rgba(94,234,240,0.3)" stroke-width="3" stroke-linecap="round"/>
    <line x1="190" y1="155" x2="230" y2="195" stroke="rgba(94,234,240,0.3)" stroke-width="3" stroke-linecap="round"/>
    <!-- Legs -->
    <line x1="105" y1="260" x2="95" y2="310" stroke="rgba(94,234,240,0.3)" stroke-width="3" stroke-linecap="round"/>
    <line x1="155" y1="260" x2="165" y2="310" stroke="rgba(94,234,240,0.3)" stroke-width="3" stroke-linecap="round"/>
    <!-- Feet -->
    <line x1="80" y1="310" x2="110" y2="310" stroke="rgba(94,234,240,0.3)" stroke-width="3" stroke-linecap="round"/>
    <line x1="150" y1="310" x2="180" y2="310" stroke="rgba(94,234,240,0.3)" stroke-width="3" stroke-linecap="round"/>
    <!-- Chest screen -->
    <rect x="95" y="155" width="70" height="50" rx="6" fill="rgba(0,0,0,0.3)" stroke="rgba(94,234,240,0.2)" stroke-width="1"/>
    <text x="130" y="176" text-anchor="middle" fill="rgba(255,80,80,0.8)" font-family="monospace" font-size="10">NO</text>
    <text x="130" y="190" text-anchor="middle" fill="rgba(255,80,80,0.8)" font-family="monospace" font-size="10">SIGNAL</text>
    <!-- Tear drop -->
    <ellipse cx="104" cy="100" rx="3" ry="5" fill="rgba(94,234,240,0.4)"/>
  </svg>

  <div class="right">
    <p class="tag">CONNECTION LOST</p>
    <h1>You're<br/>Offline</h1>

    <div class="terminal">
      <p>ping anarc.nitagartala.ac.in...</p>
      <p class="dim">Request timeout for icmp_seq 0</p>
      <p class="dim">Request timeout for icmp_seq 1</p>
      <p class="dim">Request timeout for icmp_seq 2</p>
      <p>> <span class="blink">▌</span></p>
    </div>

    <p class="desc">No network, no robots, no fun.<br/>Get back online and try again.</p>

    <button onclick="window.location.reload()">↺ &nbsp; Retry Connection</button>
  </div>
</body>
</html>
